name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded push has nothing to prove, and leaving it running burns runner
# minutes while the newer commit waits behind it. Push and pull_request runs
# for the same branch share a ref, so the group keeps them apart: a push must
# not cancel the PR run that reviews it, only an earlier run of the same kind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The package targets the macOS 26 SDK; a runner without it cannot compile.
    runs-on: macos-26
    timeout-minutes: 30

    env:
      # Inside the workspace so the cache below can find it.
      SWIFT_SCRATCH: .build/ci
      # The only test that touches the login keychain skips itself unless this is
      # set, so what CI proves is the hermetic suite.
      RUN_KEYCHAIN_TESTS: "0"

    steps:
      - uses: actions/checkout@v4

      # No toolchain pin: macos-26 defines the Xcode/Swift on the runner, and a
      # new warning fails the build below instead of joining a pile nobody
      # reads. Accepted risk: the next Xcode can turn a previously clean tree
      # red with a new warning; that failure is the signal to fix it, not noise.
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ${{ env.SWIFT_SCRATCH }}
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The tree is warning-free today, which is exactly the state worth locking
      # in: a new warning fails the build instead of joining a pile nobody reads.
      - name: Build (warnings are errors)
        run: |
          swift build \
            --product AgenticSidebar \
            --scratch-path "$SWIFT_SCRATCH" \
            -Xswiftc -warnings-as-errors

      - name: Test (warnings are errors)
        run: |
          swift test \
            --scratch-path "$SWIFT_SCRATCH" \
            -Xswiftc -warnings-as-errors

  # A gate, not a report: the tree is formatted to the checked-in
  # `.swift-format` (4-space indent, 140 columns), so the lint is clean today
  # and a new violation fails the build the same way a new warning does.
  #
  # The tool is PINNED. `brew install swift-format` ships whatever is current,
  # and a formatter's output is only reproducible for the version the tree was
  # formatted with — an unpinned gate would fail on a tool release rather than
  # on a code change. Bumping the pin is therefore a deliberate act that comes
  # with a reformat, not a side effect.
  format:
    runs-on: macos-26
    timeout-minutes: 15

    env:
      SWIFT_FORMAT_VERSION: "604.0.0"

    steps:
      - uses: actions/checkout@v4

      - name: Format check
        run: |
          brew install swift-format
          installed="$(swift-format --version)"
          echo "swift-format on the runner: $installed"
          if [[ "$installed" != "$SWIFT_FORMAT_VERSION" ]]; then
            echo "::error::swift-format $SWIFT_FORMAT_VERSION is required (found: $installed). Reformat deliberately with that version and move this pin in the same change."
            exit 1
          fi
          swift-format lint -r --strict Sources Tests
