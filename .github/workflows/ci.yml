name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded push has nothing to prove, and leaving it running burns runner
# minutes while the newer commit waits behind it.
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The package targets the macOS 26 SDK; a runner without it cannot compile.
    runs-on: macos-26
    timeout-minutes: 30

    env:
      # Inside the workspace so the cache below can find it.
      SWIFT_SCRATCH: .build/ci
      # The only test that touches the login keychain skips itself unless this is
      # set, so what CI proves is the hermetic suite.
      RUN_KEYCHAIN_TESTS: "0"

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ${{ env.SWIFT_SCRATCH }}
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The tree is warning-free today, which is exactly the state worth locking
      # in: a new warning fails the build instead of joining a pile nobody reads.
      - name: Build (warnings are errors)
        run: |
          swift build \
            --product AgenticSidebar \
            --scratch-path "$SWIFT_SCRATCH" \
            -Xswiftc -warnings-as-errors

      - name: Test (warnings are errors)
        run: |
          swift test \
            --scratch-path "$SWIFT_SCRATCH" \
            -Xswiftc -warnings-as-errors

  # Advisory: `swift-format` is not configured for this repository yet (there is
  # no `.swift-format` to state the 4-space, 100-column style the code already
  # follows by hand), so a failure here is a report, not a gate. Making it
  # blocking would fail every build until the whole tree is reformatted, which is
  # a separate decision from this workflow.
  format-report:
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Format report
        run: |
          brew install swift-format || true
          swift-format lint -r Sources Tests || true
