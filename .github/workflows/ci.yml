name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A superseded push has nothing to prove, and leaving it running burns runner
# minutes while the newer commit waits behind it. Push and pull_request runs
# for the same branch share a ref, so the group keeps them apart: a push must
# not cancel the PR run that reviews it, only an earlier run of the same kind.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build-and-test:
    # The package targets the macOS 26 SDK; a runner without it cannot compile.
    runs-on: macos-26
    timeout-minutes: 30

    env:
      # Inside the workspace so the cache below can find it.
      SWIFT_SCRATCH: .build/ci
      # The only test that touches the login keychain skips itself unless this is
      # set, so what CI proves is the hermetic suite.
      RUN_KEYCHAIN_TESTS: "0"

    steps:
      - uses: actions/checkout@v4

      # No toolchain pin: macos-26 defines the Xcode/Swift on the runner, and a
      # new warning fails the build below instead of joining a pile nobody
      # reads. Accepted risk: the next Xcode can turn a previously clean tree
      # red with a new warning; that failure is the signal to fix it, not noise.
      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: ${{ env.SWIFT_SCRATCH }}
          key: ${{ runner.os }}-spm-${{ hashFiles('Package.swift') }}
          restore-keys: |
            ${{ runner.os }}-spm-

      # The tree is warning-free today, which is exactly the state worth locking
      # in: a new warning fails the build instead of joining a pile nobody reads.
      - name: Build (warnings are errors)
        run: |
          swift build \
            --product AgenticSidebar \
            --scratch-path "$SWIFT_SCRATCH" \
            -Xswiftc -warnings-as-errors

      - name: Test (warnings are errors)
        run: |
          swift test \
            --scratch-path "$SWIFT_SCRATCH" \
            -Xswiftc -warnings-as-errors

  # Advisory, but visible: `.swift-format` states the 4-space style the code
  # follows by hand, so this report is meaningful. It stays a report rather
  # than a gate because the tree has pre-existing violations; reformatting the
  # whole tree is a separate decision. `continue-on-error` is the single
  # tolerance — a failure shows as an orange job instead of a silent green.
  format-report:
    runs-on: macos-26
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Format report
        run: |
          brew install swift-format
          swift-format lint -r Sources Tests
